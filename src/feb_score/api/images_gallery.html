<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imágenes · FEB SCORE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<style>
:root{
  --bg:#0A0A0A; --panel:#14161A; --panel-2:#16181C; --ink:#F2F3F4; --ink-2:#C9CDD3;
  --grey:#8A8F98; --rule:#23262B; --rule-2:#2E3238; --red:#E10600;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar{display:flex;align-items:center;gap:24px;padding:0 28px;height:56px;border-bottom:1px solid var(--rule)}
.brand{font-weight:900;font-size:16px;letter-spacing:-.03em}
.brand i{font-style:normal;color:var(--red)}
nav{display:flex;gap:24px;margin-left:8px}
nav a{font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--grey);padding:18px 0;position:relative;text-decoration:none}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink)}
nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
nav a[aria-disabled]{color:var(--rule-2);cursor:default}
.spacer{flex:1}
.counts{color:var(--grey);font-size:12px;font-weight:600}
.tabs{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--rule-2);background:var(--panel);border-radius:4px;
  color:var(--ink-2);padding:7px 12px;font-size:12px;font-weight:600;letter-spacing:.04em}
button:hover:not(:disabled){border-color:var(--grey)}
button:disabled{opacity:.5;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
input{font:inherit}
input[type=text],input[type=password],input[type=search]{font-size:12.5px;padding:7px 10px;border-radius:4px;
  background:var(--panel-2);border:1px solid var(--rule-2);color:var(--ink)}
.bar{width:100%;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-top:2px}
.bar input[type=password]{flex:1;min-width:200px;max-width:320px}
.note{color:var(--grey);font-size:11.5px}
.msg{color:var(--ink-2);font-size:12px;min-height:16px;flex-basis:100%}
main{padding:24px 28px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.cell{background:var(--panel);border:1px solid var(--rule);display:flex;flex-direction:column;border-radius:8px;overflow:hidden}
.pic{aspect-ratio:1/1;background:#000;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .ph{color:var(--grey);font-size:34px;font-weight:900;letter-spacing:.02em}
.ov-tag{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:8.5px;
  font-weight:800;letter-spacing:.1em;padding:2px 6px}
.info{padding:9px 10px 11px;display:flex;flex-direction:column;gap:7px;flex:1}
.name{font-size:12.5px;font-weight:700;line-height:1.25}
.eid{font-size:10px;color:var(--grey);font-family:ui-monospace,monospace}
.rowb{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.rowb button,.rowb label.up{flex:1 1 auto;text-align:center;font-size:11px;padding:5px 6px;
  border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);cursor:pointer;min-width:0}
.rowb label.up:hover,.rowb button:hover:not(:disabled){border-color:var(--grey)}
/* Media manager panel: per-entity photo library — open on Gestionar */
.mscrim{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:60;display:none;
  align-items:center;justify-content:center;padding:24px}
.mscrim.open{display:flex}
.mpanel{width:min(720px,100%);max-height:calc(100vh - 48px);background:var(--panel);
  border:1px solid var(--rule-2);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.mph{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.mph h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.mpsub{color:var(--grey);font-size:11.5px;margin-top:2px;font-family:ui-monospace,monospace}
.mph button{margin-left:auto;background:transparent;border:0;color:var(--grey);font-size:20px;padding:2px 8px}
.mpgrid{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;overflow:auto;min-height:120px}
.mpitem{background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.mpitem .p{aspect-ratio:1/1;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
.mpitem .p img{width:100%;height:100%;object-fit:cover;display:block}
.mpitem .tags{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.mpitem .tag{background:rgba(0,0,0,.65);color:#fff;font-size:8.5px;font-weight:800;
  letter-spacing:.1em;padding:2px 6px;border-radius:2px}
.mpitem .tag.prim{background:var(--red)}
.mpitem .tag.apr{background:var(--ink);color:var(--bg)}
.mpitem .meta{padding:6px 8px;font-size:10.5px;color:var(--grey);border-top:1px solid var(--rule);line-height:1.35}
.mpitem .meta b{color:var(--ink-2)}
.mpitem .acts{display:flex;gap:4px;padding:6px 6px;border-top:1px solid var(--rule);background:var(--panel)}
.mpitem .acts button{flex:1;font-size:10.5px;padding:4px 4px;background:var(--panel);
  color:var(--ink-2);border:1px solid var(--rule);cursor:pointer}
.mpitem .acts button:hover:not(:disabled){border-color:var(--grey)}
.mpempty{padding:24px;color:var(--grey);font-size:12px;text-align:center;grid-column:1/-1}
.mpmsg{padding:0 20px;color:var(--ink-2);font-size:11.5px;min-height:16px}
.mpup{padding:12px 20px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mpup label.up{padding:7px 12px;font-size:12px;font-weight:600;letter-spacing:.04em;
  color:var(--ink-2);background:var(--panel);border:1px solid var(--rule-2);cursor:pointer;border-radius:4px}
.mpup label.up:hover{border-color:var(--grey)}
.mpup input[type=text]{flex:1;min-width:140px}
.mpup .chk{display:flex;align-items:center;gap:6px;color:var(--grey);font-size:11.5px}
.mpup .chk input{accent-color:var(--red)}
.cellmsg{font-size:10.5px;color:var(--grey);min-height:13px}
.filters2{width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.filters2 select,.filters2 input[type=search]{font:inherit;font-size:12.5px;padding:7px 9px;border-radius:4px;
  background:var(--panel-2);border:1px solid var(--rule-2);color:var(--ink)}
.filters2 select{max-width:260px}
.filters2 input[type=search]{min-width:180px}
.seg{display:flex;gap:0}
.seg button{border-right-width:0}
.seg button:last-child{border-right-width:1px}
.hint{color:var(--grey);font-size:11.5px}
.empty,.loading{color:var(--grey);padding:40px 0}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <span class="brand">FEB SCORE<i>!</i></span>
    <nav>
      <a href="/v1/explore">EXPLORADOR</a>
      <a href="/v1/content/ideas">IDEAS</a>
      <a href="/v1/images/gallery" class="on">IMÁGENES</a>
      <a href="/v1/content/review">COLA</a>
    </nav>
    <div class="tabs" id="tabs"></div>
    <span class="spacer"></span>
    <span class="counts" id="counts">cargando…</span>
  </div>
  <div class="bar" style="padding:14px 28px 0">
    <label class="note">Temporada</label>
    <select id="season"><option>cargando…</option></select>
    <button id="reload">Recargar</button>
    <input type="password" id="key" placeholder="Clave de API — para subir o quitar imágenes"
           autocomplete="off" spellcheck="false">
    <button id="savekey">Guardar clave</button>
    <span class="note" id="keynote"></span>
    <span class="msg" id="msg"></span>
  </div>
  <div class="filters2" id="filters2">
    <input type="search" id="q" placeholder="Buscar por nombre…" autocomplete="off">
    <select id="teamf"><option value="">Todos los equipos</option></select>
    <span class="seg">
      <button id="f-all"  aria-pressed="true">Todas</button>
      <button id="f-miss" aria-pressed="false">Sin imagen propia</button>
      <button id="f-own"  aria-pressed="false">Con imagen propia</button>
    </span>
    <span class="hint" id="shown"></span>
  </div>
</header>

<main><div id="out" class="loading">Elige una temporada y pulsa Cargar.</div></main>

<div class="mscrim" id="mscrim" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="mpanel">
    <header class="mph">
      <div>
        <h3 id="mpTitle">Fotos</h3>
        <div class="mpsub" id="mpSub"></div>
      </div>
      <button id="mpClose" aria-label="Cerrar">×</button>
    </header>
    <div class="mpgrid" id="mpGrid"></div>
    <div class="mpmsg" id="mpMsg"></div>
    <div class="mpup">
      <label class="up" for="mpFile">Añadir foto</label>
      <input id="mpFile" type="file" accept="image/png,image/jpeg,image/webp" style="display:none">
      <input id="mpPhotographer" type="text" placeholder="Fotógrafo/a">
      <input id="mpLicense" type="text" placeholder="Licencia (ej. CC-BY, promo)">
      <label class="chk"><input type="checkbox" id="mpApproved"> Aprobada</label>
      <label class="chk"><input type="checkbox" id="mpCommercial"> Uso comercial</label>
    </div>
  </div>
</div>

<script>
const OUT = document.getElementById('out');
const MSG = document.getElementById('msg');
let DATA = {players:[], teams:[]}, TAB = 'players';
let Q = '', TEAM = '', OWN = 'all';   // filters: text, team, override state

const keyInput = document.getElementById('key');
const keyNote = document.getElementById('keynote');
keyInput.value = sessionStorage.getItem('febKey') || '';       // shared with the queue page
setKeyNote();
document.getElementById('savekey').onclick = () => {
  sessionStorage.setItem('febKey', keyInput.value.trim()); setKeyNote();
};
function setKeyNote(){
  keyNote.textContent = sessionStorage.getItem('febKey')
    ? 'clave guardada en esta pestaña' : 'sin clave: solo lectura';
}
const apiKey = () => (sessionStorage.getItem('febKey') || '').trim();

const seasonInput = document.getElementById('season');
const desiredGallerySeason = new URLSearchParams(location.search).get('season')
  || localStorage.getItem('febGallerySeason') || '';
document.getElementById('reload').onclick = load;
seasonInput.addEventListener('change', load);

async function loadSeasons(){
  let seasons = [];
  try {
    const r = await fetch('/v1/seasons');
    if (r.ok) seasons = (await r.json()).seasons || [];
  } catch (e) {}
  let codes = seasons.map(s => s.season_code);
  if (desiredGallerySeason && !codes.includes(desiredGallerySeason))
    codes.unshift(desiredGallerySeason);
  if (!codes.length) codes.push(desiredGallerySeason || '2024-2025');
  seasonInput.innerHTML = codes.map(c =>
    '<option value="' + c + '">' + c + '</option>').join('');
  seasonInput.value = (desiredGallerySeason && codes.includes(desiredGallerySeason))
    ? desiredGallerySeason : codes[0];
}

async function load(){
  const season = seasonInput.value.trim();
  if (!season){ MSG.textContent = 'No hay temporada seleccionada.'; return; }
  localStorage.setItem('febGallerySeason', season);
  OUT.className = 'loading'; OUT.textContent = 'Cargando el catálogo…';
  try{
    const r = await fetch('/v1/images/catalog?season=' + encodeURIComponent(season));
    if (!r.ok){ OUT.className='empty'; OUT.textContent = 'No se pudo cargar (' + r.status + ').'; return; }
    DATA = await r.json();
    render();
  }catch(e){ OUT.className='empty'; OUT.textContent = String(e); }
}

/* --------------------------------------------------------------- filtering */
// The gallery's real job is finding who still needs a photo among ~450 players,
// so the override state is a first-class filter, not an afterthought.
function visible(list){
  const q = Q.trim().toLowerCase();
  return list.filter(e => {
    if (OWN === 'own'  && !e.has_override) return false;
    if (OWN === 'miss' &&  e.has_override) return false;
    if (TEAM && e.team_external_id !== TEAM) return false;
    if (q && !(e.name || '').toLowerCase().includes(q)) return false;
    return true;
  });
}

function syncFilterControls(){
  // Team filter only means something for players; teams have no team.
  const teamSel = document.getElementById('teamf');
  teamSel.disabled = TAB !== 'players';
  const seen = new Map();
  (DATA.players || []).forEach(p => {
    if (p.team_external_id) seen.set(p.team_external_id, p.team_name || p.team_external_id);
  });
  const current = TEAM;
  teamSel.innerHTML = '<option value="">Todos los equipos</option>';
  [...seen.entries()].sort((a,b) => a[1].localeCompare(b[1])).forEach(([id,name]) => {
    const o = document.createElement('option');
    o.value = id; o.textContent = name; o.selected = id === current;
    teamSel.appendChild(o);
  });
  [['f-all','all'],['f-miss','miss'],['f-own','own']].forEach(([id,val]) => {
    document.getElementById(id).setAttribute('aria-pressed', String(OWN === val));
  });
}

document.getElementById('q').oninput = e => { Q = e.target.value; render(); };
document.getElementById('teamf').onchange = e => { TEAM = e.target.value; render(); };
[['f-all','all'],['f-miss','miss'],['f-own','own']].forEach(([id,val]) => {
  document.getElementById(id).onclick = () => { OWN = val; render(); };
});

function render(){
  const tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  [['players','Jugadores'],['teams','Equipos']].forEach(([k,label]) => {
    const list = DATA[k] || [];
    const overridden = list.filter(e => e.has_override).length;
    const b = document.createElement('button');
    b.textContent = `${label} (${list.length}${overridden ? ' · ' + overridden + ' propias' : ''})`;
    b.setAttribute('aria-pressed', String(k === TAB));
    b.onclick = () => { TAB = k; render(); };
    tabs.appendChild(b);
  });
  syncFilterControls();
  const all = DATA[TAB] || [];
  const list = visible(all);
  document.getElementById('shown').textContent =
    list.length === all.length ? `${all.length} en total`
                               : `${list.length} de ${all.length}`;
  const totalOv = (DATA.players||[]).concat(DATA.teams||[]).filter(e => e.has_override).length;
  document.getElementById('counts').textContent =
    `${(DATA.players||[]).length} jugadores · ${(DATA.teams||[]).length} equipos · ${totalOv} imágenes propias`;

  OUT.className = list.length ? 'grid' : 'empty';
  OUT.innerHTML = '';
  if (!list.length){
    OUT.textContent = all.length ? 'Ningún resultado con estos filtros.' : 'Nada que mostrar.';
    return;
  }
  list.forEach(e => OUT.appendChild(cell(e)));
}

function initials(name){
  return (name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
}

function cell(e){
  const el = document.createElement('article');
  el.className = 'cell';
  // Overridden entities are served from our endpoint; the rest come straight
  // from FEB in the browser. A cache-buster refreshes the thumb after an upload.
  const src = e.has_override
    ? `/v1/images/${e.kind}/${encodeURIComponent(e.external_id)}?t=${Date.now()}`
    : e.feb_url;
  el.innerHTML = `
    <div class="pic">
      ${e.has_override ? '<span class="ov-tag">PROPIA</span>' : ''}
      <span class="ph">${initials(e.name)}</span>
      <img loading="lazy" alt="" src="${src}"
           onload="this.previousElementSibling.style.display='none'"
           onerror="this.style.display='none'">
    </div>
    <div class="info">
      <div class="name">${esc(e.name)}</div>
      <div class="eid">${e.kind} · ${esc(e.external_id)}</div>
      <div class="cellmsg"></div>
      <div class="rowb"></div>
    </div>`;
  const row = el.querySelector('.rowb'), msg = el.querySelector('.cellmsg');

  const up = document.createElement('label');
  up.className = 'up'; up.textContent = e.has_override ? 'Reemplazar' : 'Subir';
  const file = document.createElement('input');
  file.type = 'file'; file.accept = 'image/png,image/jpeg,image/webp'; file.style.display = 'none';
  up.appendChild(file);
  file.onchange = () => upload(e, file.files[0], el, msg);
  row.appendChild(up);

  if (e.has_override){
    const del = document.createElement('button');
    del.textContent = 'Quitar';
    del.onclick = () => remove(e, el, msg);
    row.appendChild(del);
  }
  const mgr = document.createElement('button');
  mgr.textContent = 'Gestionar';
  mgr.title = 'Ver todas las fotos, subir más y elegir la principal';
  mgr.onclick = () => openMedia(e);
  row.appendChild(mgr);
  return el;
}

/* -------------------------------------------------- media library manager --- */
// The gallery cell shows the ONE image the renderer will use. Behind it lives a
// library of photos per entity (with rights metadata + primary/approved flags),
// so an operator can hold several and pick which one goes on the next card. The
// panel below is that library's UI: list, upload, promote, approve, delete.
let MP_ENT = null;
async function openMedia(e){
  MP_ENT = e;
  document.getElementById('mpTitle').textContent = e.name || e.external_id;
  document.getElementById('mpSub').textContent = `${e.kind} · ${e.external_id}`;
  document.getElementById('mpMsg').textContent = '';
  document.getElementById('mpGrid').innerHTML =
    '<div class="mpempty">Cargando fotos…</div>';
  document.getElementById('mscrim').classList.add('open');
  document.getElementById('mscrim').setAttribute('aria-hidden','false');
  await refreshMedia();
}
function closeMedia(){
  document.getElementById('mscrim').classList.remove('open');
  document.getElementById('mscrim').setAttribute('aria-hidden','true');
  MP_ENT = null;
  // The gallery cell shows the primary approved thumb; a refresh picks up any
  // promotion/upload the operator just did.
  load();
}
async function refreshMedia(){
  if (!MP_ENT) return;
  const g = document.getElementById('mpGrid');
  try{
    const r = await fetch(`/v1/media/${MP_ENT.kind}/${encodeURIComponent(MP_ENT.external_id)}`);
    const d = await r.json();
    const assets = d.assets || [];
    if (!assets.length){
      g.innerHTML = '<div class="mpempty">Aún no hay fotos en la librería.</div>';
      return;
    }
    g.innerHTML = '';
    for (const a of assets) g.appendChild(mediaTile(a));
  }catch(err){
    g.innerHTML = `<div class="mpempty">${esc(String(err))}</div>`;
  }
}
function mediaTile(a){
  const el = document.createElement('div');
  el.className = 'mpitem';
  const tags = [];
  if (a.role === 'primary') tags.push('<span class="tag prim">PRINCIPAL</span>');
  if (a.approved) tags.push('<span class="tag apr">APROBADA</span>');
  const meta = [];
  if (a.photographer) meta.push(`<b>${esc(a.photographer)}</b>`);
  if (a.license_type) meta.push(esc(a.license_type));
  if (a.commercial_use) meta.push('uso comercial');
  el.innerHTML = `
    <div class="p">
      <div class="tags">${tags.join('')}</div>
      <img loading="lazy" alt="" src="/v1/media/asset/${encodeURIComponent(a.asset_id)}/image">
    </div>
    <div class="meta">${meta.join(' · ') || '—'}</div>
    <div class="acts"></div>`;
  const acts = el.querySelector('.acts');
  const btn = (label, fn, disabled) => {
    const b = document.createElement('button');
    b.textContent = label; if (disabled) b.disabled = true;
    b.onclick = fn;
    acts.appendChild(b);
    return b;
  };
  btn('Principal', () => act(`/v1/media/asset/${encodeURIComponent(a.asset_id)}/promote`, 'POST'),
      a.role === 'primary');
  btn(a.approved ? 'Desaprobar' : 'Aprobar',
      () => act(`/v1/media/asset/${encodeURIComponent(a.asset_id)}/approve?approved=${!a.approved}`, 'POST'));
  btn('Borrar', () => {
    if (!confirm('¿Borrar esta foto de la librería?')) return;
    act(`/v1/media/asset/${encodeURIComponent(a.asset_id)}`, 'DELETE');
  });
  return el;
}
async function act(url, method){
  if (!apiKey()){ document.getElementById('mpMsg').textContent = 'falta la clave'; return; }
  document.getElementById('mpMsg').textContent = 'guardando…';
  try{
    const r = await fetch(url, { method, headers:{'Authorization':'Bearer '+apiKey()} });
    if (!r.ok){
      const d = await r.json().catch(()=>({}));
      document.getElementById('mpMsg').textContent =
        `error ${r.status}: ${d?.error?.message||''}`;
      return;
    }
    document.getElementById('mpMsg').textContent = '';
    await refreshMedia();
  }catch(err){ document.getElementById('mpMsg').textContent = String(err); }
}
document.getElementById('mpClose').onclick = closeMedia;
document.getElementById('mscrim').addEventListener('click', ev => {
  if (ev.target === document.getElementById('mscrim')) closeMedia();
});
document.getElementById('mpFile').onchange = async () => {
  if (!MP_ENT) return;
  const f = document.getElementById('mpFile').files[0];
  if (!f) return;
  if (!apiKey()){ document.getElementById('mpMsg').textContent = 'falta la clave'; return; }
  if (f.size > 512*1024){ document.getElementById('mpMsg').textContent = 'máx. 512 KB'; return; }
  const q = new URLSearchParams({
    photographer: document.getElementById('mpPhotographer').value.trim(),
    license_type: document.getElementById('mpLicense').value.trim(),
    approved: String(document.getElementById('mpApproved').checked),
    commercial_use: String(document.getElementById('mpCommercial').checked),
  });
  document.getElementById('mpMsg').textContent = 'subiendo…';
  try{
    const r = await fetch(
      `/v1/media/${MP_ENT.kind}/${encodeURIComponent(MP_ENT.external_id)}?${q}`,
      { method:'POST',
        headers:{'Authorization':'Bearer '+apiKey(), 'Content-Type': f.type}, body: f });
    if (!r.ok){
      const d = await r.json().catch(()=>({}));
      document.getElementById('mpMsg').textContent =
        `error ${r.status}: ${d?.error?.message||''}`;
      return;
    }
    document.getElementById('mpFile').value = '';
    await refreshMedia();
  }catch(err){ document.getElementById('mpMsg').textContent = String(err); }
};

async function upload(e, f, el, msg){
  if (!f) return;
  if (!apiKey()){ msg.textContent = 'falta la clave'; return; }
  if (f.size > 512*1024){ msg.textContent = 'máx. 512 KB'; return; }
  msg.textContent = 'subiendo…';
  try{
    const r = await fetch(`/v1/images/${e.kind}/${encodeURIComponent(e.external_id)}`, {
      method:'PUT',
      headers:{'Authorization':'Bearer ' + apiKey(), 'Content-Type': f.type},
      body: f,
    });
    if (!r.ok){ const d = await r.json().catch(()=>({})); msg.textContent = `error ${r.status}: ${d?.error?.message||''}`; return; }
    e.has_override = true;
    OUT.replaceChild(cell(e), el);   // re-render this cell with the new image
    render();
  }catch(err){ msg.textContent = String(err); }
}

async function remove(e, el, msg){
  if (!apiKey()){ msg.textContent = 'falta la clave'; return; }
  msg.textContent = 'quitando…';
  try{
    const r = await fetch(`/v1/images/${e.kind}/${encodeURIComponent(e.external_id)}`, {
      method:'DELETE', headers:{'Authorization':'Bearer ' + apiKey()},
    });
    if (!r.ok){ msg.textContent = `error ${r.status}`; return; }
    e.has_override = false;
    OUT.replaceChild(cell(e), el);
    render();
  }catch(err){ msg.textContent = String(err); }
}
