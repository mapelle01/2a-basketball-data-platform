<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cola · FEB SCORE!</title>
<style>
:root{
  --bg:#0B0A0A; --panel:#141212; --panel-2:#1C1919; --ink:#F7F5F4; --ink-2:#CFC9C7;
  --grey:#918B89; --rule:#2A2626; --red:#FF2A22;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);
  padding:20px 28px;display:flex;align-items:baseline;gap:20px 20px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em}
h1 span{color:var(--red)}
.counts{color:var(--grey);font-size:12.5px}
.filters{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--panel);
  color:var(--ink-2);padding:6px 12px;font-size:12px;letter-spacing:.04em}
button:hover:not(:disabled){border-color:var(--grey)}
button:disabled{opacity:.5;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main{padding:0 28px 80px}

/* --- generate + key bar --- */
.bar{width:100%;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-top:4px}
.gen{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gen label{font-size:11.5px;color:var(--grey);letter-spacing:.04em}
.gen input,.gen select{font:inherit;font-size:13px;padding:7px 9px;background:var(--panel-2);
  border:1px solid var(--rule);color:var(--ink);width:96px}
.gen select{width:auto;min-width:120px}
.gen input.round{width:64px}
.gen .go{border-color:var(--ink);color:var(--ink);font-weight:700}
input[type=password]{flex:1;min-width:200px;max-width:340px;font:inherit;font-size:12.5px;
  padding:7px 10px;background:var(--panel-2);border:1px solid var(--rule);color:var(--ink)}
.note{color:var(--grey);font-size:11.5px}
.genmsg{font-size:12px;color:var(--ink-2);min-height:16px;flex-basis:100%}

/* --- overview: what's done / pending per round --- */
.overview{margin:22px 0 4px;display:flex;flex-direction:column;gap:6px}
.ov-title{font-size:11px;letter-spacing:.14em;color:var(--grey);text-transform:uppercase}
.ov-rounds{display:flex;gap:8px;flex-wrap:wrap}
.ov-round{border:1px solid var(--rule);background:var(--panel);padding:8px 11px;min-width:120px}
.ov-round b{font-size:13px;font-weight:800;letter-spacing:-.01em}
.ov-round .season{color:var(--grey);font-weight:400;font-size:11px}
.ov-line{margin-top:5px;font-size:11px;color:var(--grey);display:flex;gap:8px;flex-wrap:wrap}
.ov-line .p{color:#E6C84A}.ov-line .a{color:var(--ink)}.ov-line .pub{color:var(--red)}

main>h2{margin:26px 0 14px;font-size:12px;letter-spacing:.14em;color:var(--grey);
  text-transform:uppercase;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:22px}
.card{background:var(--panel);border:1px solid var(--rule);display:flex;flex-direction:column}
.thumb{background:#000;aspect-ratio:1080/1350;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.meta{padding:15px 17px 17px;display:flex;flex-direction:column;gap:8px;flex:1}
.top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:800;letter-spacing:.12em;padding:3px 8px;white-space:nowrap}
.s-pending_review{background:#3D3837;color:var(--ink)}
.s-approved{background:var(--ink);color:var(--bg)}
.s-rejected,.s-failed{border:1.5px solid var(--grey);color:var(--grey)}
.s-published,.s-scheduled{background:var(--red);color:#fff}
.type{font-size:11px;color:var(--grey);letter-spacing:.07em}
.nota{margin-left:auto;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
h3{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.hl{margin:0;font-size:13px;color:var(--ink-2)}
.cap{margin:0;font-size:12.5px;color:var(--grey);line-height:1.5}
.idline{margin:0;font-size:11px;color:var(--grey);font-family:ui-monospace,monospace}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.actions button,.actions a{flex:1 1 45%}
a.btn{display:block;text-align:center;text-decoration:none;font-size:12px;letter-spacing:.04em;
  padding:6px 12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2)}
a.btn:hover{border-color:var(--grey)}
a.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ok{border-color:var(--ink)}
.msg{font-size:12px;color:var(--grey);min-height:16px}
.edited{font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--grey);color:var(--grey)}
.editor{display:none;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--rule);margin-top:6px}
.editor.open{display:flex}
.editor label{font-size:10.5px;letter-spacing:.08em;color:var(--grey);text-transform:uppercase}
.editor input,.editor textarea{font:inherit;font-size:12.5px;padding:7px 9px;width:100%;
  background:var(--panel-2);border:1px solid var(--rule);color:var(--ink);resize:vertical}
.editor textarea{min-height:74px;line-height:1.45}
.editor .row{display:flex;gap:8px}
.cand{margin:22px 0 8px;border:1px solid var(--rule);background:var(--panel);padding:16px 18px}
.cand h2{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.cand .sub{color:var(--grey);font-size:12px;margin:4px 0 6px}
.cand .fam{margin-top:14px;font-size:10.5px;letter-spacing:.14em;color:var(--grey);text-transform:uppercase;
  display:flex;gap:10px;align-items:center}
.cand .fam button{font-size:10px;padding:2px 7px}
.cand .row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule)}
.cand .row label{display:flex;gap:10px;align-items:baseline;cursor:pointer;flex:1}
.cand .subj{font-weight:700;font-size:13.5px}
.cand .lab{color:var(--ink-2);font-size:12.5px}
.cand .pri{margin-left:auto;color:var(--grey);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cand .dup{color:var(--red);font-size:10.5px;letter-spacing:.06em}
.cand .foot{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.cand .foot .n{color:var(--grey);font-size:12px}
.purge{border-color:var(--rule);color:var(--grey)}
.purge:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.empty,.loading{color:var(--grey);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>Cola FEB SCORE<span>!</span></h1>
  <a class="home" href="/v1/images/gallery" style="color:var(--grey);font-size:12.5px;text-decoration:none">galería de imágenes →</a>
  <a class="home" href="/v1/explore" style="color:var(--grey);font-size:12.5px;text-decoration:none">explorador →</a>
  <span class="counts" id="counts">cargando…</span>
  <div class="filters" id="filters"></div>
  <div class="bar">
    <div class="gen">
      <label>Generar jornada</label>
      <select id="gseason"><option>cargando…</option></select>
      <input id="ground" class="round" type="number" min="1" max="40" placeholder="J">
      <button class="go" id="gen">Generar</button>
    </div>
    <input type="password" id="key" placeholder="Clave de API — para generar, aprobar o rechazar"
           autocomplete="off" spellcheck="false">
    <button id="savekey">Guardar clave</button>
    <button class="purge" id="purge">Purgar rechazadas</button>
    <span class="note" id="keynote"></span>
    <span class="genmsg" id="genmsg"></span>
  </div>
</header>

<main>
  <div id="candidates"></div>
  <div id="out" class="loading">Cargando la cola…</div>
</main>

<script>
const OUT = document.getElementById('out');
const LABELS = {pending_review:'PENDIENTE', approved:'APROBADA', rejected:'RECHAZADA',
                published:'PUBLICADA', scheduled:'PROGRAMADA', failed:'FALLIDA',
                generated:'GENERADA', detected:'DETECTADA'};
let ITEMS = [], FILTER = 'pending_review';

/* ---------------------------------------------------------------- API key */
const keyInput = document.getElementById('key');
const keyNote = document.getElementById('keynote');
// Session only: the key is gone when the tab closes, and never written to disk.
keyInput.value = sessionStorage.getItem('febKey') || '';
setKeyNote();
document.getElementById('savekey').onclick = () => {
  sessionStorage.setItem('febKey', keyInput.value.trim());
  setKeyNote(); render();
};
function setKeyNote(){
  keyNote.textContent = sessionStorage.getItem('febKey')
    ? 'clave guardada en esta pestaña' : 'sin clave: solo lectura';
}
const apiKey = () => (sessionStorage.getItem('febKey') || '').trim();

/* ------------------------------------------------------- generate a round */
const genMsg = document.getElementById('genmsg');
const gSeason = document.getElementById('gseason');
const gRound = document.getElementById('ground');
let seasonTouched = false;
document.getElementById('gen').onclick = generate;
gSeason.addEventListener('change', () => { seasonTouched = true; });
gRound.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

async function loadSeasons(){
  let seasons = [];
  try {
    const r = await fetch('/v1/seasons');
    if (r.ok) seasons = (await r.json()).seasons || [];
  } catch (e) {}
  const codes = seasons.map(s => s.season_code);
  if (!codes.length) codes.push('2025-2026');
  gSeason.innerHTML = codes.map(c =>
    '<option value="' + c + '">' + c + '</option>').join('');
}
function preferSeason(code){
  if (seasonTouched || !code) return;
  const opts = Array.from(gSeason.options).map(o => o.value);
  if (!opts.includes(code)){
    gSeason.insertAdjacentHTML('afterbegin',
      '<option value="' + code + '">' + code + '</option>');
  }
  gSeason.value = code;
}

const CAND = document.getElementById('candidates');
const FAMILY_LABEL = {jornada:'De la jornada', ficha:'Curiosos de ficha', temporada:'De temporada'};

// Step 1 — detect. Show every candidate; the operator picks. Nothing is created
// or rendered until "Crear seleccionadas".
async function generate(){
  const season = gSeason.value.trim();
  const round = parseInt(gRound.value, 10);
  if (!season) { genMsg.textContent = 'Selecciona una temporada.'; return; }
  if (!apiKey()) { genMsg.textContent = 'Hace falta la clave de API para generar.'; return; }
  if (!round) { genMsg.textContent = 'Escribe el número de jornada.'; return; }

  const btn = document.getElementById('gen');
  btn.disabled = true; genMsg.textContent = `Detectando la jornada ${round}…`;
  try{
    const r = await fetch(
      `/v1/content/pipeline/rounds/${encodeURIComponent(season)}/${round}/candidates`,
      {headers:{'Authorization':'Bearer ' + apiKey()}});
    const data = await r.json().catch(() => ({}));
    if (!r.ok){ genMsg.textContent = `Error ${r.status}: ${data?.error?.message || 'no se pudo detectar'}`; return; }
    const cands = data.candidates || [];
    genMsg.textContent = cands.length
      ? `Jornada ${round}: ${cands.length} candidatas. Marca las que quieras crear.`
      : `Jornada ${round}: no se detectó nada (¿partidos finalizados con datos?).`;
    renderCandidates(season, round, cands);
  }catch(e){ genMsg.textContent = String(e); }
  finally{ btn.disabled = false; }
}

function renderCandidates(season, round, cands){
  CAND.innerHTML = '';
  if (!cands.length) return;
  const box = document.createElement('section');
  box.className = 'cand';
  box.innerHTML = `<h2>Jornada ${round} · ${esc(season)}</h2>`
    + `<p class="sub">Elige qué convertir en carta. Nada se crea hasta que le des a Crear.</p>`;
  const groups = {jornada:[], ficha:[], temporada:[]};
  cands.forEach(c => (groups[c.family] || (groups[c.family] = [])).push(c));

  ['jornada','ficha','temporada'].forEach(fam => {
    const list = groups[fam]; if (!list || !list.length) return;
    const head = document.createElement('div'); head.className = 'fam';
    const title = document.createElement('span'); title.textContent = FAMILY_LABEL[fam] || fam;
    const all = document.createElement('button'); all.textContent = 'marcar todo';
    const none = document.createElement('button'); none.textContent = 'ninguno';
    head.append(title, all, none); box.appendChild(head);
    list.forEach(c => box.appendChild(candRow(c, fam)));
    all.onclick = () => box.querySelectorAll(`input[data-fam="${fam}"]:not(:disabled)`).forEach(x => x.checked = true);
    none.onclick = () => box.querySelectorAll(`input[data-fam="${fam}"]`).forEach(x => x.checked = false);
  });

  const foot = document.createElement('div'); foot.className = 'foot';
  const create = document.createElement('button'); create.className = 'go'; create.textContent = 'Crear seleccionadas';
  const cancel = document.createElement('button'); cancel.textContent = 'Cancelar';
  const note = document.createElement('span'); note.className = 'n';
  cancel.onclick = () => { CAND.innerHTML = ''; genMsg.textContent = ''; };
  create.onclick = () => createSelected(season, round, box, note, create);
  foot.append(create, cancel, note); box.appendChild(foot);
  CAND.appendChild(box);
}

function candRow(c, fam){
  const row = document.createElement('div'); row.className = 'row';
  const dup = c.already_queued;
  row.innerHTML = `
    <label>
      <input type="checkbox" data-fam="${fam}" value="${c.story_key}" ${dup ? 'disabled' : 'checked'}>
      <span class="subj">${esc(c.subject)}</span>
      <span class="lab">${esc(c.label)}</span>
    </label>
    <span class="pri">${dup ? '<span class=\'dup\'>ya en cola</span>' : 'prioridad ' + Math.round(c.priority)}</span>`;
  return row;
}

// Step 2 — create exactly the checked ones.
async function createSelected(season, round, box, note, btn){
  const keys = [...box.querySelectorAll('input[type=checkbox]:checked')].map(x => x.value);
  if (!keys.length) { note.textContent = 'no has marcado ninguna'; return; }
  btn.disabled = true; note.textContent = `creando ${keys.length}…`;
  try{
    const r = await fetch(
      `/v1/content/pipeline/rounds/${encodeURIComponent(season)}/${round}`,
      {method:'POST', headers:{'Authorization':'Bearer ' + apiKey(), 'Content-Type':'application/json'},
       body: JSON.stringify({story_keys: keys})});
    const data = await r.json().catch(() => ({}));
    if (!r.ok){ note.textContent = `error ${r.status}: ${data?.error?.message || ''}`; btn.disabled = false; return; }
    const n = data.content_generated ?? (data.items || []).length;
    CAND.innerHTML = '';
    genMsg.textContent = `Jornada ${round}: ${n} cartas nuevas en la cola.`;
    FILTER = 'pending_review';
    await load();
  }catch(e){ note.textContent = String(e); btn.disabled = false; }
}

/* ------------------------------------------------------------ housekeeping */
// The queue only ever grows; this is the one way to shrink it. The API refuses
// to touch anything live or published, so the worst case is losing rejects.
document.getElementById('purge').onclick = async () => {
  if (!apiKey()) { genMsg.textContent = 'Hace falta la clave de API para purgar.'; return; }
  const c = counts();
  const removable = (c.rejected || 0) + (c.failed || 0);
  if (!removable) return;
  const noun = n => `${n} ${n === 1 ? 'tarjeta' : 'tarjetas'}`;
  if (!confirm(`Se borrarán ${noun(removable)} rechazadas o fallidas, para siempre.\n`
             + `Las pendientes, aprobadas y publicadas no se tocan. ¿Seguir?`)) return;
  const btn = document.getElementById('purge');
  btn.disabled = true; genMsg.textContent = 'purgando…';
  try{
    const r = await fetch('/v1/content/queue/purge', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + apiKey(), 'Content-Type': 'application/json'},
      body: '{}',
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok){ genMsg.textContent = `Error ${r.status}: ${data?.error?.message || ''}`; }
    else { genMsg.textContent = `Purgadas ${noun(data.removed ?? removable)}.`; }
    await load();
  }catch(e){ genMsg.textContent = String(e); }
  finally{ btn.disabled = false; }
};

/* --------------------------------------------------------------- load/read */
async function load(){
  try{
    const r = await fetch('/v1/content/queue', {headers:{'Accept':'application/json'}});
    const data = await r.json();
    ITEMS = Array.isArray(data) ? data : (data.items || []);
    ITEMS.sort((a,b) => (b.story.round_number||0) - (a.story.round_number||0));
    preferSeason(newestSeason());
    render();
  }catch(e){
    OUT.className = 'empty';
    OUT.textContent = 'No se pudo leer la cola: ' + e;
  }
}

function newestSeason(){
  // Prefill the generate box with the season already most present in the queue,
  // so the common case is one click on a round number.
  const c = {};
  ITEMS.forEach(i => { const s = i.story.season_code; if (s) c[s] = (c[s]||0)+1; });
  return Object.entries(c).sort((a,b) => b[1]-a[1])[0]?.[0] || '';
}

function counts(){
  const c = {};
  ITEMS.forEach(i => c[i.status] = (c[i.status]||0) + 1);
  return c;
}

function renderFilters(){
  const c = counts(), box = document.getElementById('filters');
  const keys = ['pending_review', ...Object.keys(c).filter(k => k !== 'pending_review')];
  box.innerHTML = '';
  [...keys, 'all'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = k === 'all' ? `TODAS (${ITEMS.length})` : `${LABELS[k]||k} (${c[k]||0})`;
    b.setAttribute('aria-pressed', String(k === FILTER));
    b.onclick = () => { FILTER = k; render(); };
    box.appendChild(b);
  });
  document.getElementById('counts').textContent =
    `${ITEMS.length} tarjetas · ` + Object.entries(c).map(([k,v]) => `${(LABELS[k]||k).toLowerCase()} ${v}`).join(' · ');

  // The purge only ever removes rejected/failed cards, so the button says
  // exactly how many that is — and disables itself when there are none.
  const removable = (c.rejected || 0) + (c.failed || 0);
  const pb = document.getElementById('purge');
  pb.textContent = `Purgar rechazadas (${removable})`;
  pb.disabled = removable === 0;
}

/* ----------------------------------------------- overview (what's pending) */
function overview(){
  // One row per (season, round): how many cards, and how many still need a
  // decision vs. already out. This is the "where am I" glance.
  const by = new Map();
  ITEMS.forEach(i => {
    const key = `${i.story.season_code}|${i.story.round_number}`;
    if (!by.has(key)) by.set(key, {season:i.story.season_code, round:i.story.round_number,
                                   total:0, pending:0, approved:0, published:0});
    const o = by.get(key); o.total++;
    if (i.status === 'pending_review') o.pending++;
    else if (i.status === 'approved') o.approved++;
    else if (i.status === 'published' || i.status === 'scheduled') o.published++;
  });
  const rounds = [...by.values()].sort((a,b) => (b.round||0)-(a.round||0));
  if (!rounds.length) return null;

  const wrap = document.createElement('section');
  wrap.className = 'overview';
  wrap.innerHTML = `<div class="ov-title">Por jornada</div>`;
  const row = document.createElement('div'); row.className = 'ov-rounds';
  rounds.forEach(o => {
    const el = document.createElement('div'); el.className = 'ov-round';
    const parts = [];
    if (o.pending)   parts.push(`<span class="p">${o.pending} pendientes</span>`);
    if (o.approved)  parts.push(`<span class="a">${o.approved} aprobadas</span>`);
    if (o.published) parts.push(`<span class="pub">${o.published} publicadas</span>`);
    if (!parts.length) parts.push('sin pendientes');
    el.innerHTML =
      `<b>Jornada ${o.round ?? '—'}</b> <span class="season">${esc(o.season||'')}</span>`
      + `<div class="ov-line">${parts.join('')}</div>`;
    row.appendChild(el);
  });
  wrap.appendChild(row);
  return wrap;
}

/* ---------------------------------------------------------------- one card */
function card(i){
  const f = i.story.facts || {}, copy = i.copy || {};
  const name = f.player_name || f.team_name || f.biggest_win_winner?.team_name || '—';
  const rating = (f.rating === null || f.rating === undefined) ? '' :
    `<span class="nota">${String(f.rating).replace('.', ',')}</span>`;
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `
    <div class="thumb"><img loading="lazy" src="/v1/content/items/${i.content_id}/render.svg" alt=""></div>
    <div class="meta">
      <div class="top">
        <span class="chip s-${i.status}">${LABELS[i.status] || i.status}</span>
        <span class="type">${i.story.story_type}</span>${i.edited ? '<span class="edited">EDITADA</span>' : ''}${rating}
      </div>
      <h3>${esc(name)}</h3>
      <p class="hl">${esc(copy.headline || '')}</p>
      <p class="cap">${esc(copy.caption || '')}</p>
      <p class="idline">jornada ${i.story.round_number ?? '—'} · ${i.content_id.slice(0,8)}</p>
      <p class="msg"></p>
      <div class="actions"></div>
      <div class="editor">
        ${i.template_id === 'player_of_round' ? `
        <div>
          <label>Título en la imagen</label>
          <input class="e-title" maxlength="60" placeholder="(el que dibuja la carta)">
        </div>` : ''}
        <div>
          <label>Descripción de Instagram</label>
          <textarea class="e-cap" placeholder="(el pie del post)"></textarea>
        </div>
        <div class="row">
          <button class="e-save ok">Guardar cambios</button>
          <button class="e-cancel">Cancelar</button>
        </div>
      </div>
    </div>`;
  const actions = el.querySelector('.actions'), msg = el.querySelector('.msg');
  if (i.status === 'pending_review') {
    actions.append(action('Aprobar', 'approve', i, msg, true), action('Rechazar', 'reject', i, msg, false));
  } else if (i.status === 'approved') {
    actions.append(action('Rechazar', 'reject', i, msg, false));
  }
  actions.append(download(i), copyCaption(i, msg));
  if (i.status === 'pending_review' || i.status === 'approved') {
    actions.append(editButton(i, el, msg));
    wireEditor(i, el, msg);
  }
  return el;
}

function download(item){
  // The publishable image, 1080x1350. A plain link so the browser streams it
  // straight to disk instead of holding a couple of megabytes in the tab.
  const a = document.createElement('a');
  a.className = 'btn';
  a.href = `/v1/content/items/${item.content_id}/render.png`;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = 'Descargar PNG';
  return a;
}

function copyCaption(item, msg){
  // Publishing an Instagram post is image + text; the text lives here as the
  // caption, so put it one click from the clipboard next to the image.
  const b = document.createElement('button');
  b.textContent = 'Copiar pie';
  const text = (item.copy && item.copy.caption) || '';
  b.disabled = !text;
  b.onclick = async () => {
    try{
      await navigator.clipboard.writeText(text);
      msg.textContent = 'Pie copiado — pégalo en Instagram.';
    }catch(e){
      // Clipboard needs a secure context / permission; fall back to selection.
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); msg.textContent = 'Pie copiado.'; }
      catch(_) { msg.textContent = 'No se pudo copiar automáticamente.'; }
      ta.remove();
    }
  };
  return b;
}

function action(label, verb, item, msg, primary){
  const b = document.createElement('button');
  b.textContent = label;
  if (primary) b.className = 'ok';
  b.onclick = async () => {
    if (!apiKey()) { msg.textContent = 'hace falta la clave de API'; return; }
    b.disabled = true; msg.textContent = 'enviando…';
    try{
      const r = await fetch(`/v1/content/items/${item.content_id}/review/${verb}`, {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + apiKey(), 'Content-Type': 'application/json'},
        body: '{}'
      });
      if (!r.ok) { msg.textContent = `error ${r.status}`; b.disabled = false; return; }
      await load();
    }catch(e){ msg.textContent = String(e); b.disabled = false; }
  };
  return b;
}

function editButton(item, el, msg){
  const b = document.createElement('button');
  b.textContent = 'Editar';
  b.onclick = () => el.querySelector('.editor').classList.toggle('open');
  return b;
}

function wireEditor(item, el, msg){
  const box = el.querySelector('.editor');
  const title = box.querySelector('.e-title');   // absent on non-player cards
  const cap = box.querySelector('.e-cap');
  const f = item.story.facts || {}, copy = item.copy || {};
  if (title) title.value = f.section_label || '';
  cap.value = copy.caption || '';
  box.querySelector('.e-cancel').onclick = () => box.classList.remove('open');
  box.querySelector('.e-save').onclick = async () => {
    if (!apiKey()) { msg.textContent = 'hace falta la clave de API'; return; }
    const payload = {};
    // Send only what actually changed, so a blank title never overwrites.
    if (title && title.value.trim() && title.value !== (f.section_label || ''))
      payload.section_label = title.value.trim();
    if (cap.value !== (copy.caption || ''))
      payload.caption = cap.value;
    if (!Object.keys(payload).length) { msg.textContent = 'nada que cambiar'; return; }
    msg.textContent = 'guardando…';
    try{
      const r = await fetch(`/v1/content/items/${item.content_id}`, {
        method: 'PATCH',
        headers: {'Authorization': 'Bearer ' + apiKey(), 'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      if (!r.ok){
        const d = await r.json().catch(() => ({}));
        msg.textContent = `error ${r.status}: ${d?.error?.message || ''}`;
        return;
      }
      await load();
    }catch(e){ msg.textContent = String(e); }
  };
}

/* ------------------------------------------------------------------ render */
function render(){
  renderFilters();
  OUT.className = '';
  OUT.innerHTML = '';
  const ov = overview();
  if (ov) OUT.appendChild(ov);

  const list = FILTER === 'all' ? ITEMS : ITEMS.filter(i => i.status === FILTER);
  const h2 = document.createElement('h2');
  h2.textContent = FILTER === 'all' ? 'Todas las tarjetas'
                                    : (LABELS[FILTER] || FILTER) + 's';
  OUT.appendChild(h2);

  if (!list.length){
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'Nada en este estado.';
    OUT.appendChild(e); return;
  }
  const grid = document.createElement('div'); grid.className = 'grid';
  list.forEach(i => grid.appendChild(card(i)));
  OUT.appendChild(grid);
}

function esc(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

loadSeasons().then(load);
</script>
