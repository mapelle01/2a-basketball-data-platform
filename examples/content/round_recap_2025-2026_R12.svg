<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d13"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f2b"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Eyebrow -->
  <g transform="translate(60, 60)">
    <rect x="0" y="8" width="48" height="4" fill="#3b82f6"/>
    <text x="64" y="18" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="4">
      SEGUNDA FEB · TEMPORADA 2025-2026
    </text>
    <text x="960" y="18" fill="#475569" font-size="14" font-weight="500" text-anchor="end" letter-spacing="2">
      ROUND RECAP · v1
    </text>
  </g>

  <!-- Hero -->
  <g transform="translate(60, 200)">
    <text x="0" y="0" fill="#94a3b8" font-size="26" font-weight="600" letter-spacing="4">
      JORNADA
    </text>
    <text x="0" y="180" fill="#f8fafc" font-size="240" font-weight="900" font-family="'JetBrains Mono', monospace" letter-spacing="-8">
      12
    </text>
    <text x="0" y="240" fill="#3b82f6" font-size="28" font-weight="800" letter-spacing="1">
      4 partidos · el resumen
    </text>
  </g>

  <!-- Card 1: Top scorer -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="465" height="220" rx="16" fill="url(#cardBg)"/>
    <g transform="translate(28, 40)">
      <text x="0" y="0" fill="#3b82f6" font-size="14" font-weight="800" letter-spacing="3">01</text>
      <text x="34" y="0" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="3">MÁXIMO ANOTADOR</text>
      <text x="0" y="60" fill="#f8fafc" font-size="28" font-weight="800">
        C. Sáez
      </text>
      <text x="0" y="90" fill="#94a3b8" font-size="18" font-weight="500">
        Alicante Cimarrones
      </text>
      <text x="0" y="160" fill="#f8fafc" font-size="72" font-weight="900" font-family="'JetBrains Mono', monospace" letter-spacing="-3">
        31
      </text>
      <text x="200" y="160" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="3">PTS</text>
    </g>
  </g>

  <!-- Card 2: Biggest win -->
  <g transform="translate(555, 540)">
    <rect x="0" y="0" width="465" height="220" rx="16" fill="url(#cardBg)"/>
    <g transform="translate(28, 40)">
      <text x="0" y="0" fill="#3b82f6" font-size="14" font-weight="800" letter-spacing="3">02</text>
      <text x="34" y="0" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="3">MAYOR DIFERENCIA</text>
      <text x="0" y="60" fill="#f8fafc" font-size="28" font-weight="800">
        Alicante Cimarrones
      </text>
      <text x="0" y="90" fill="#94a3b8" font-size="18" font-weight="500">
        se impuso con solvencia
      </text>
      <text x="0" y="160" fill="#f8fafc" font-size="72" font-weight="900" font-family="'JetBrains Mono', monospace" letter-spacing="-3">
        +32
      </text>
      <text x="240" y="160" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="3">PTS</text>
    </g>
  </g>

  <!-- Card 3: Closest game -->
  <g transform="translate(60, 780)">
    <rect x="0" y="0" width="465" height="220" rx="16" fill="url(#cardBg)"/>
    <g transform="translate(28, 40)">
      <text x="0" y="0" fill="#3b82f6" font-size="14" font-weight="800" letter-spacing="3">03</text>
      <text x="34" y="0" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="3">PARTIDO MÁS AJUSTADO</text>
      <text x="0" y="70" fill="#f8fafc" font-size="24" font-weight="700">
        Decidido por
      </text>
      <text x="0" y="160" fill="#f8fafc" font-size="72" font-weight="900" font-family="'JetBrains Mono', monospace" letter-spacing="-3">
        2
      </text>
      <text x="150" y="160" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="3">PTS</text>
    </g>
  </g>

  <!-- Card 4: Matches played -->
  <g transform="translate(555, 780)">
    <rect x="0" y="0" width="465" height="220" rx="16" fill="url(#cardBg)"/>
    <g transform="translate(28, 40)">
      <text x="0" y="0" fill="#3b82f6" font-size="14" font-weight="800" letter-spacing="3">04</text>
      <text x="34" y="0" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="3">PARTIDOS DISPUTADOS</text>
      <text x="0" y="70" fill="#f8fafc" font-size="24" font-weight="700">
        La jornada al completo
      </text>
      <text x="0" y="160" fill="#f8fafc" font-size="72" font-weight="900" font-family="'JetBrains Mono', monospace" letter-spacing="-3">
        4
      </text>
      <text x="180" y="160" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="3">GAMES</text>
    </g>
  </g>

  <!-- Info strip -->
  <g transform="translate(60, 1050)">
    <rect x="0" y="0" width="960" height="120" rx="16" fill="#141821"/>
    <text x="480" y="50" fill="#94a3b8" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="4">EL RESUMEN</text>
    <text x="480" y="90" fill="#f8fafc" font-size="24" font-weight="600" text-anchor="middle">
      Resumen de la jornada 12: 4 partidos disputados. C. Sáez (31 pts) máximo anotador; mayor diferencia: 32 puntos.
    </text>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1260)">
    <rect x="0" y="0" width="4" height="30" fill="#3b82f6"/>
    <text x="18" y="24" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="1">2aFEB SCORE</text>
    <text x="960" y="24" fill="#475569" font-size="14" font-weight="500" text-anchor="end" letter-spacing="2">
      1.0 · round_recap v1.0
    </text>
  </g>
</svg>
