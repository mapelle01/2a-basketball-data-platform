name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feb_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FEB_SCORE_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5433/feb_test
      FEB_SCORE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Dependency audit
        run: python -m pip check
      - name: Tests (unit + integration + API + production + architecture + PostgreSQL)
        run: python -m pytest -q
      - name: Full-suite guard
        run: |
          summary=$(python -m pytest --co -q | tail -1)
          echo "$summary"
          test -z "$(python -m pytest -q 2>&1 | grep -E 'failed|xfailed|skipped' | grep -v 'passed')" || exit 1

  docker:
    name: docker image + compose (external condition)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t feb_score:ci .
      - name: Compose config (fail-closed env contract)
        run: |
          set -e
          # without .env, compose must FAIL (missing POSTGRES_PASSWORD/API_KEYS)
          if docker compose config >/dev/null 2>&1; then
            echo "expected compose config to require POSTGRES_PASSWORD/FEB_SCORE_API_KEYS"; exit 1
          fi
          # with a .env, compose must validate
          cat > .env <<'EOF'
          FEB_SCORE_ENV=production
          FEB_SCORE_DATABASE_URL=postgresql://feb:ci-password@db:5432/feb_score
          POSTGRES_PASSWORD=ci-password
          FEB_SCORE_API_KEYS=ci-key=ci:system
          FEB_SCORE_LOG_LEVEL=info
          FEB_SCORE_RATE_LIMIT=true
          FEB_SCORE_RATE_LIMIT_PER_MINUTE=120
          EOF
          docker compose config -q
      - name: Compose up + smoke
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:8000/ready | grep -q '"status": "ready"'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ready
          KEY=$(grep '^FEB_SCORE_API_KEYS=' .env | cut -d= -f2 | cut -d= -f1)
          curl -fsS -X POST http://127.0.0.1:8000/v1/commands/create_or_update_match \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -d '{"payload":{"external_id":"ci-1","competition_id":"c","season_code":"2025-2026","round_number":1,"scheduled_at":"2026-02-01T18:30:00Z","home_team":{"external_id":"h","name":"H"},"away_team":{"external_id":"a","name":"A"},"source":{"id":"ci","fetched_at":"2026-02-01T18:00:00Z","s3_path":"s3://x"}}}' \
            | grep '"status": "accepted"'
          docker compose ps
      - name: Container diagnostics (FASE 15)
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color api db 2>&1 || true
          curl -sv http://127.0.0.1:8000/health 2>&1 || true
          curl -sv http://127.0.0.1:8000/ready 2>&1 || true
      - name: Compose down
        run: docker compose down -v