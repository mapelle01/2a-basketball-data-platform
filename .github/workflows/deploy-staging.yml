# FASE 18.1 - Staging deployment to Railway.
#
# Trigger: manual (workflow_dispatch) or push to the `staging` branch.
# Until the RAILWAY_TOKEN secret is configured, every deploy step prints a
# message and exits 0 (no-op), so this workflow can never deploy against
# non-existent infrastructure or fail on missing credentials.
#
# Note on gating: GitHub Actions does NOT accept `secrets` inside an `if`
# expression (job-level or step-level) - the workflow fails to compile. The
# presence of RAILWAY_TOKEN is therefore checked inside each `run` step via the
# job-level env, which is the supported way to reference secrets.
#
# Secrets required (set in the GitHub repository, NOT in this file):
#   RAILWAY_TOKEN            Railway project token (scoped to the staging env)
#   RAILWAY_SERVICE_NAME     name of the API service in Railway
#   RAILWAY_STAGING_DOMAIN   the service's HTTPS domain (e.g. feb-score.up.railway.app
#                            or a custom domain)
#   FEB_SCORE_SMOKE_KEY      an API key valid in staging (same value must be
#                            referenced by FEB_SCORE_API_KEYS in Railway)
#
# Flow: tests -> Railway builds the image from Dockerfile -> railway up ->
# wait for /ready -> smoke test (health, ready, POST create_or_update_match,
# event match_upserted, GET match).
#
# Migrations: run by the application at boot (server.py) against the staging
# Postgres; railway.toml sets overlapSeconds=0 so only one instance boots at a
# time (single-replica staging).

name: deploy-staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  test:
    name: tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Dependency audit
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q

  deploy:
    name: deploy to Railway (staging)
    needs: test
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
      RAILWAY_STAGING_DOMAIN: ${{ secrets.RAILWAY_STAGING_DOMAIN }}
      FEB_SCORE_SMOKE_KEY: ${{ secrets.FEB_SCORE_SMOKE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "skipping: RAILWAY_TOKEN secret not configured"; exit 0; }
          curl -fsSL https://railway.app/install.sh | sh

      - name: Deploy (Railway builds from Dockerfile)
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "skipping: RAILWAY_TOKEN secret not configured"; exit 0; }
          railway up --service "$RAILWAY_SERVICE_NAME"

      - name: Wait for readiness
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "skipping: RAILWAY_TOKEN secret not configured"; exit 0; }
          url="https://$RAILWAY_STAGING_DOMAIN/ready"
          for i in $(seq 1 60); do
            if curl -fsS "$url" | grep -q '"status": *"ready"'; then
              echo "READY after $((i * 5))s"
              curl -fsS "$url"
              exit 0
            fi
            sleep 5
          done
          echo "staging /ready never became ready" >&2
          exit 1

      - name: Smoke test
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "skipping: RAILWAY_TOKEN secret not configured"; exit 0; }
          bash scripts/staging_smoke.sh "https://$RAILWAY_STAGING_DOMAIN" "$FEB_SCORE_SMOKE_KEY"