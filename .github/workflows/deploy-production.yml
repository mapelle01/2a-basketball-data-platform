# FASE 20 — Production CD (Railway).
#
# Trigger: MANUAL ONLY (workflow_dispatch). Production is NEVER deployed from any
# push. A human must start it and pass the manual "confirm" gate; the job targets the
# GitHub "production" Environment (no required-reviewers configured under the
# Free plan), so no auto-merge environment approval is enforced by GitHub
# — the `confirm` input + fail-fast guards are the human-in-the-loop control.
#
# Secrets required in the GitHub repository (NOT in this file):
#   RAILWAY_TOKEN            Railway project token scoped to the production environment
#   FEB_SCORE_PROD_SMOKE_KEY API key valid in production (matches FEB_SCORE_API_KEYS)
#
# Flow: tests -> secret guards -> Railway builds the image from Dockerfile -> railway up
# -> wait for /ready -> authenticated smoke -> 401 check.
#
# IMPORTANT: RAILWAY_TOKEN must contain ONLY the token value. Do not paste
# "RAILWAY_TOKEN=...", "Bearer ...", quotes, or surrounding whitespace into the secret.
# If the token itself contains '=' characters, those are part of the value and are valid.

name: deploy-production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy production" to confirm (manual gate)'
        required: true
        default: ''

permissions:
  contents: read

env:
  IMAGE_REF: ${{ github.sha }}  # immutable traceability reference

jobs:
  test:
    name: tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Dependency audit
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q

  deploy:
    name: deploy to Railway (production)
    needs: test
    environment:
      name: production
    runs-on: ubuntu-latest
    env:
      CONFIRM: ${{ inputs.confirm }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      FEB_SCORE_PROD_SMOKE_KEY: ${{ secrets.FEB_SCORE_PROD_SMOKE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: "Guard: manual confirmation"
        run: |
          [ "$CONFIRM" = "deploy production" ] || { echo "::error::Manual confirmation required: type 'deploy production' in the workflow_dispatch input 'confirm'."; exit 1; }

      - name: "Guard + resolve secrets/identifiers"
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::RAILWAY_TOKEN secret not configured"; exit 1; }
          echo "RAILWAY_SERVICE_NAME=${RAILWAY_SERVICE_NAME:-feb-score-api}" >> "$GITHUB_ENV"
          echo "RAILWAY_PROD_DOMAIN=${RAILWAY_PROD_DOMAIN:-feb-score-api-production.up.railway.app}" >> "$GITHUB_ENV"
          [ -n "$FEB_SCORE_PROD_SMOKE_KEY" ] || { echo "::error::FEB_SCORE_PROD_SMOKE_KEY secret not configured"; exit 1; }

          # Catch common GitHub-secret paste mistakes without ever printing the token.
          case "$RAILWAY_TOKEN" in
            RAILWAY_TOKEN=*)
              echo "::error::RAILWAY_TOKEN contains 'RAILWAY_TOKEN='. Store only the token value in the secret."; exit 1 ;;
            Bearer\ *)
              echo "::error::RAILWAY_TOKEN contains a 'Bearer ' prefix. Store only the raw token value."; exit 1 ;;
          esac
          if printf '%s' "$RAILWAY_TOKEN" | grep -q '[[:space:]]'; then
            echo "::error::RAILWAY_TOKEN contains whitespace/newlines. Recreate the GitHub secret with only the token value."; exit 1
          fi

          echo "service=$RAILWAY_SERVICE_NAME"
          echo "domain=$RAILWAY_PROD_DOMAIN"

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
          "$HOME/.railway/bin/railway" --version

      - name: Deploy (Railway builds from Dockerfile)
        run: |
          railway up \
            --project "7878b33c-c516-4ba7-a946-94564b2c62de" \
            --environment "production" \
            --service "$RAILWAY_SERVICE_NAME" \
            --ci
          echo "deployment target=production/$RAILWAY_SERVICE_NAME"

      - name: Wait for readiness
        run: |
          url="https://$RAILWAY_PROD_DOMAIN/ready"
          for i in $(seq 1 60); do
            if curl -fsS "$url" | grep -q '\"status\": *\"ready\"'; then
              echo "READY after $((i * 5))s"
              curl -fsS "$url"
              curl -fsS "https://$RAILWAY_PROD_DOMAIN/health"
              exit 0
            fi
            sleep 5
          done
          echo "::error::production /ready never became ready" >&2
          exit 1

      - name: Smoke test (authenticated)
        run: |
          bash scripts/staging_smoke.sh "https://$RAILWAY_PROD_DOMAIN" "$FEB_SCORE_PROD_SMOKE_KEY"

      - name: Security check (unauthenticated -> 401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://$RAILWAY_PROD_DOMAIN/v1/commands/create_or_update_match" \
            -H 'Content-Type: application/json' \
            -d '{"payload":{"external_id":"g","competition_id":"c","season_code":"2025","round_number":1,"scheduled_at":"2026-03-15T20:00:00Z","home_team":{"external_id":"h","name":"H"},"away_team":{"external_id":"a","name":"A"},"source":{"id":"s","fetched_at":"2026-03-15T19:00:00Z","s3_path":"s3://x"}}}')
          [ "$code" = "401" ] || { echo "::error::expected 401 without API key, got $code"; exit 1; }
          echo "auth_401_check=PASS"

      - name: Evidence summary
        run: |
          echo "PRODUCTION_DEPLOY=PASS"
          echo "domain=$RAILWAY_PROD_DOMAIN"
          echo "image_ref=${IMAGE_REF}"
